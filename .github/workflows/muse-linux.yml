name: Muse Linux checks
on:
  push:
    paths:
      - 'muse-linux/**'
      - '.github/workflows/muse-linux.yml'
  pull_request:
    paths:
      - 'muse-linux/**'
      - '.github/workflows/muse-linux.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muse-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: muse-linux/package-lock.json
      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libatspi2.0-dev libglib2.0-dev libjson-glib-dev libwayland-dev \
            libxkbcommon-dev libcairo2-dev libgtk-3-dev
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run native:build
      - run: npm test
