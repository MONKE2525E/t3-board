<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Muse for Linux</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #fff; color: #191919; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 420px; padding: 40px 28px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 28px; font-weight: 600; margin: 24px 0 12px; letter-spacing: -.5px; }
    p { color: #60646c; line-height: 1.6; margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 24px; color: white; background: #0866ff; border-radius: 24px; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #4b8aff; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { :root { background: #161616; color: #f4f4f4; } p { color: #b4b4b4; } }
  </style>
</head>
<body><main><img src="../assets/icon.png" alt="Muse"><h1>Couldn’t connect to Muse</h1><p>Check your internet connection, then try again. Your sign-in stays saved on this computer.</p><a href="https://muse.ai/">Try again</a></main></body>
</html>
